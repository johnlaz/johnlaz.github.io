<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAZLAB Creations</title>
<meta name="description" content="LAZLAB Creations — independent apps and tools.">
<meta name="theme-color" content="#14111c">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="LAZLAB Creations">
<meta property="og:description" content="Independent apps and tools.">
<meta property="og:image" content="https://johnlaz.github.io/wallpaper.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  html,body{height:100%;margin:0;background:#14111c;overflow:hidden}
  /* Layer 1: same wallpaper, fills the whole screen (blurred on tall screens so the bars blend) */
  .bg{position:fixed;inset:0;background:url(wallpaper.jpg) center/cover no-repeat}
  /* Layer 2: sharp wallpaper — fills the screen on wide displays */
  .fg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;animation:in 1.2s ease-out both}
  .fg img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  /* Tall/narrow screens: zoom so the brain fills the width, fade the edges into the slate colour */
  @media (max-aspect-ratio: 4/3){
    .bg{background:radial-gradient(ellipse at 50% 50%,#1d1830 0%,#14111c 70%)}
    .fg img{flex:none;width:185vw;max-width:none;height:auto;object-fit:contain;
      -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);
              mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%)}
  }
  @keyframes in{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.fg{animation:none}}
  h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
  <h1>LAZLAB Creations</h1>
  <div class="bg" aria-hidden="true"></div>
  <div class="fg"><img src="wallpaper.jpg" alt="LAZLAB" width="2576" height="1405"></div>
</body>
</html>
